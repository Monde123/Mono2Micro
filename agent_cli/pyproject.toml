[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mono2micro-agent"
version = "0.1.0"
description = "Local CLI agent for empirical, phased monolith-to-microservice migration and modularization, based on Hammad et al. (2023)."
readme = "README.md"
authors = [
    { name = "Mono2Micro Engineering Team" }
]
requires-python = ">=3.10"
license = { text = "See LICENSE in repository root" }
keywords = ["monolith", "microservices", "modular-monolith", "refactoring", "ast", "strangler-fig", "architecture", "louvain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
agent = "mono2micro.cli:main"
mono2micro = "mono2micro.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "benchmarks"]
