name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Benchmark Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e agent_cli

      - name: Run Python test suite
        run: |
          PYTHONPATH=agent_cli:agent_cli/benchmarks pytest agent_cli/tests -v

      - name: Run benchmark smoke suite
        run: |
          PYTHONPATH=agent_cli:agent_cli/benchmarks python -m mono2micro.cli bench --output benchmarks/results

      - name: Run system diagnostics
        run: |
          PYTHONPATH=agent_cli python -m mono2micro.cli doctor

  frontend:
    name: Web Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Lint and build
        run: |
          npm run lint
          npm run build
